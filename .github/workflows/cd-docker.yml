name: CD - Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push run ID from main (also used for rollback)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production-docker
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/resolve-release.yml
    with:
      run_id: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || format('{0}', github.event.workflow_run.id) }}
      allow_older: ${{ github.event_name == 'workflow_dispatch' }}
  deploy:
    needs: release
    if: needs.release.outputs.eligible == 'true'
    runs-on: [self-hosted, Windows, X64, docker-linux]
    environment: production-docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: docker-release
          path: artifacts/deploy/docker
          run-id: ${{ needs.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Deploy tested Docker image
        shell: powershell
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          CI_RUN_ID: ${{ needs.release.outputs.run_id }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DOCKER_PORT: ${{ vars.DOCKER_PORT }}
          APP_CONNECTION_STRING: ${{ secrets.APP_CONNECTION_STRING }}
          MIGRATION_CONNECTION_STRING: ${{ secrets.MIGRATION_CONNECTION_STRING }}
          APPLY_DATABASE_MIGRATIONS: ${{ vars.APPLY_DATABASE_MIGRATIONS }}
        run: ./scripts/deploy/Deploy-Docker.ps1
